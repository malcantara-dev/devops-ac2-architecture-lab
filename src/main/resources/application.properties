spring.application.name=Grupo_7_PraticaATDD

spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html

# Desafio 3: endereco do ia-service (no compose vem de IA_URL)
ia.url=${IA_URL:http://localhost:8000}
ia.timeout-ms=2000

# Desafio 4: notificacao assincrona (async = RabbitMQ) ou sincrona (sync = HTTP direto no worker)
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
notificacao.modo=${NOTIFICACAO_MODO:async}
notificacao.fila=notificacoes.curso-concluido
notificacao.worker-url=${NOTIFICACAO_WORKER_URL:http://localhost:8001}

# Desafio 6: metricas para o Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=gamificacao-core
management.metrics.distribution.percentiles-histogram.ranking.consulta=true
